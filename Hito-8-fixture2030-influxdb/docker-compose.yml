services:
  influxdb:
    image: influxdb:3-core
    pull_policy: always
    container_name: fixture2030-influxdb
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-local
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --http-bind=0.0.0.0:8181
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ${HOME}/docker/data/influxdb:/var/lib/influxdb3/data
      - ${HOME}/docker/data/influxdb/plugins:/var/lib/influxdb3/plugins
      - ./scripts:/scripts:ro
    networks:
      - fixture2030

networks:
  # Red compartida entre los 6 modulos de base de datos, para cuando se
  # integren (ver CHANGELOG.md). Hoy cada modulo se sigue levantando solo,
  # esto no cambia ese flujo: Compose crea la red si no existe y la
  # reutiliza si otro modulo ya la creo.
  fixture2030:
    name: fixture2030_net