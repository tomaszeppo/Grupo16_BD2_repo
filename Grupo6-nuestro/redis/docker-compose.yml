# Ambiente local de Redis para el modulo de cache de usuarios y sesiones del
# Fixture 2030 (Hito 7). Un unico nodo: alcanza para probar sesiones, cache,
# concurrencia y memoria. La consigna pide montar los datos en
# ~/docker/data/redis del host (misma convencion que el Hito 6 con Cassandra).

services:
  redis:
    image: redis:latest
    container_name: fixture2030-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - ~/docker/data/redis:/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
