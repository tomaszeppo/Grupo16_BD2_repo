# Ambiente local de Neo4j para el modulo de grafos del Fixture 2030 (Hito 5).
# Las credenciales vienen del archivo .env (ver .env.example); no hay valores
# por defecto, asi que sin .env el compose no levanta.

services:
  neo4j:
    image: neo4j:5
    container_name: fixture2030-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Carpeta con los .cypher, para correrlos con cypher-shell sin pegarlos a mano.
      - ./queries:/queries:ro
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?definir NEO4J_USER en el archivo .env}/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en el archivo .env}
    healthcheck:
      # NEO4J_AUTH tiene la forma usuario/clave; se separa para no repetir las credenciales.
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  neo4j_data:
  neo4j_logs:
