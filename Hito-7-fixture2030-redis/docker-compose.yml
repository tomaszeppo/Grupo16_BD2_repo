services:
  redis:
    image: redis:latest
    container_name: fixture2030-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --loglevel notice
    volumes:
      # En la materia: ~/docker/data/redis. ${HOME} resuelve ese mismo directorio en macOS/Linux.
      - ${HOME}/docker/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fixture2030-redis-net

networks:
  fixture2030-redis-net:
    driver: bridge
