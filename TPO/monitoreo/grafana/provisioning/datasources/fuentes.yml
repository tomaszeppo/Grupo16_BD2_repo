apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus-tpo
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
  # Audiencia y estadísticas de los partidos, en SQL sobre InfluxDB 3 (sin autenticación en el laboratorio).
  - name: InfluxDB
    uid: influxdb-tpo
    type: influxdb
    access: proxy
    url: http://influxdb:8181
    editable: false
    jsonData:
      version: SQL
      dbName: fixture2030_metrics
      httpMode: POST
      insecureGrpc: true
    secureJsonData:
      token: sin-autenticacion
