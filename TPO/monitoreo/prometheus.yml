# Prometheus del proyecto final. Recolección cada 5 s: una simulación dura 90 s y los picos, pocos segundos;
# a 15 s quedarían con uno o ningún punto.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # Métricas de la API (suma de todos sus procesos): pedidos, latencia, cada base, en vivo, puntuación.
  - job_name: api
    static_configs:
      - targets: ["api:8010"]
        labels: {componente: api}

  # Redis: el primario (sesiones, presencia, comentarios) y la réplica de la "otra región".
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://redis:6379", "redis://redis_replica:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "redis://([^:]+):.*"
        target_label: instancia
      - target_label: __address__
        replacement: redis_exporter:9121

  # MongoDB: el conjunto de réplicas del prode.
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb_exporter:9216"]
        labels: {componente: mongodb}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
