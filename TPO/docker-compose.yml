# Prode Mundial 2030 — proyecto final. Se levanta solo: no depende de las carpetas de los hitos.
# Redis, Cassandra e InfluxDB forman parte del TPO.
name: fixture2030-tpo

x-mongo: &mongo
  image: mongo:7.0
  restart: unless-stopped
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/clave/archivo", "--wiredTigerCacheSizeGB", "0.25"]
  depends_on:
    mongo_clave:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().ok"]
    interval: 5s
    timeout: 5s
    retries: 20
  mem_limit: ${MONGO_MEMORIA:-512m}
  cpus: ${MONGO_CPUS:-1.0}
  networks: [tpo]

x-cassandra-entorno: &cassandra_entorno
  MAX_HEAP_SIZE: ${CASSANDRA_HEAP:-384M}
  HEAP_NEWSIZE: 96M
  CASSANDRA_CLUSTER_NAME: fixture2030
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_RACK: rack1
  CASSANDRA_SEEDS: cassandra_america

x-cassandra: &cassandra
  image: cassandra:4.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 40
  mem_limit: ${CASSANDRA_MEMORIA:-900m}
  cpus: ${CASSANDRA_CPUS:-0.75}
  networks: [tpo]

x-api-entorno: &api_entorno
  MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
  MONGO_DB: prode2030
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
  REDIS_REPLICA_URL: redis://redis_replica:6379/0
  ADMIN_CLAVE: ${ADMIN_CLAVE:?definir ADMIN_CLAVE en .env}
  CALENDARIO_TTL_SEGUNDOS: ${CALENDARIO_TTL_SEGUNDOS:-30}
  API_PROCESOS: ${API_PROCESOS:-2}
  LOG_NIVEL: ${LOG_NIVEL:-INFO}
  API_MEMORIA: ${API_MEMORIA:-512m}
  API_CPUS: ${API_CPUS:-1.0}
  MONGO_MEMORIA: ${MONGO_MEMORIA:-512m}
  MONGO_CPUS: ${MONGO_CPUS:-1.0}
  NEO4J_MEMORIA: ${NEO4J_MEMORIA:-1g}
  NEO4J_CPUS: ${NEO4J_CPUS:-1.0}

services:
  # Los tres nodos se autentican entre sí con un archivo de clave. Se genera una sola vez y queda en un volumen.
  mongo_clave:
    image: mongo:7.0
    restart: "no"
    entrypoint:
      - bash
      - -c
      - "[ -s /clave/archivo ] || openssl rand -base64 756 > /clave/archivo; chmod 400 /clave/archivo; chown 999:999 /clave/archivo"
    volumes: [mongo_clave:/clave]

  mongo1:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO1_PUERTO:-27217}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo1_datos:/data/db]

  mongo2:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO2_PUERTO:-27218}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo2_datos:/data/db]

  mongo3:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO3_PUERTO:-27219}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo3_datos:/data/db]

  # Arma el conjunto de réplicas y crea el usuario administrador. Comparte la red de mongo1 para entrar por
  # localhost, que es la única vía que MongoDB permite antes de que exista un usuario. Se puede repetir.
  mongo_inicio:
    image: mongo:7.0
    restart: "no"
    network_mode: "service:mongo1"
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}
    environment:
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}
    volumes: ["./mongo/iniciar_replica.sh:/iniciar_replica.sh:ro"]
    entrypoint: ["bash", "/iniciar_replica.sh"]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:${NEO4J_HTTP_PUERTO:-7475}:7474", "127.0.0.1:${NEO4J_BOLT_PUERTO:-7688}:7687"]
    volumes: [neo4j_datos:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: ${NEO4J_MEMORIA:-1g}
    cpus: ${NEO4J_CPUS:-1.0}
    networks: [tpo]

  # Sesiones, presencia en los partidos en vivo, reparto de comentarios entre procesos y contadores.
  # AOF cada segundo: un reinicio no cierra las sesiones abiertas.
  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
    ports: ["127.0.0.1:${REDIS_PUERTO:-6380}:6379"]
    volumes: [redis_datos:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_MEMORIA:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    networks: [tpo]

  # Comentarios: un datacenter por región (ver docs/arquitectura_regiones.md). Cada nodo guarda una copia
  # completa; cada usuario escribe y lee en el de su región sin esperar al otro.
  # Copia de solo lectura de Redis: representa "la otra región". En el laboratorio la API escribe y lee en el
  # primario; la réplica queda para leer el ranking desde otra región. Ver docs/arquitectura_regiones.md.
  redis_replica:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--replicaof", "redis", "6379", "--masterauth", "${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}", "--requirepass", "${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}", "--replica-read-only", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
    depends_on:
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${REDIS_REPLICA_PUERTO:-6381}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q master_link_status:up"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_REPLICA_MEMORIA:-256m}
    cpus: ${REDIS_REPLICA_CPUS:-0.25}
    networks: [tpo]

  cassandra_america:
    <<: *cassandra
    environment:
      <<: *cassandra_entorno
      CASSANDRA_DC: america
    ports: ["127.0.0.1:${CASSANDRA_AMERICA_PUERTO:-9043}:9042"]
    volumes: ["cassandra_america_datos:/var/lib/cassandra"]

  cassandra_europa:
    <<: *cassandra
    depends_on:
      cassandra_america: {condition: service_healthy}
    environment:
      <<: *cassandra_entorno
      CASSANDRA_DC: europa
    ports: ["127.0.0.1:${CASSANDRA_EUROPA_PUERTO:-9044}:9042"]
    volumes: ["cassandra_europa_datos:/var/lib/cassandra"]

  # Esquema repetible: crea lo que falta y pasa el keyspace a la replicación por región si venía de antes.
  cassandra_inicio:
    image: cassandra:4.1
    restart: "no"
    depends_on:
      cassandra_america: {condition: service_healthy}
      cassandra_europa: {condition: service_healthy}
    volumes: ["./cassandra:/esquema:ro"]
    entrypoint: ["bash", "/esquema/iniciar.sh"]
    networks: [tpo]

  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    cpus: ${INFLUX_CPUS:-0.5}
    mem_limit: ${INFLUX_MEMORIA:-1g}
    command: ["influxdb3", "serve", "--node-id=tpo", "--object-store=file", "--data-dir=/var/lib/influxdb3/data", "--http-bind=0.0.0.0:8181", "--without-auth"]
    volumes: ["influx_datos:/var/lib/influxdb3"]
    networks: [tpo]

  influx_inicio:
    image: influxdb:3-core
    depends_on: [influxdb]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 60); do
          influxdb3 show databases --host http://influxdb:8181 --format csv > /tmp/bases 2>/dev/null && break;
          sleep 2;
        done;
        grep -qx fixture2030_metrics /tmp/bases || influxdb3 create database fixture2030_metrics --host http://influxdb:8181;
        influxdb3 update database --database fixture2030_metrics --retention-period none --host http://influxdb:8181
    # Sin vencimiento: la audiencia y las estadísticas se guardan para el análisis posterior. La segunda línea
    # corrige una base creada por una versión anterior, que vencía los datos a la hora.
    networks: [tpo]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo_inicio: {condition: service_completed_successfully}
      neo4j: {condition: service_healthy}
      redis: {condition: service_healthy}
      cassandra_inicio: {condition: service_completed_successfully}
      influx_inicio: {condition: service_completed_successfully}
    environment:
      <<: *api_entorno
      PROMETHEUS_MULTIPROC_DIR: /tmp/metricas
    command: ["sh", "-c", "rm -rf /tmp/metricas && mkdir -p /tmp/metricas && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8010 --no-access-log --workers ${API_PROCESOS:-2}"]
    ports: ["127.0.0.1:${API_PUERTO:-8010}:8010"]
    volumes: ["./:/srv"]
    mem_limit: ${API_MEMORIA:-512m}
    cpus: ${API_CPUS:-1.0}
    networks: [tpo]

  # Carga de datos, pruebas de integración y generador de carga. Corre dentro de la red para poder seguir
  # al conjunto de réplicas:  docker compose run --rm herramientas <comando>
  herramientas:
    build: .
    profiles: ["herramientas"]
    environment:
      <<: *api_entorno
      API_URL: http://api:8010
      COMMIT: ${COMMIT:-sin commit}
    command: ["python", "-m", "seed.run"]
    volumes: ["./:/srv"]
    networks: [tpo]

  # --- Monitoreo: Prometheus recolecta, Grafana muestra. Puertos distintos a los del Hito 13 (9091, 3001). ---
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_datos:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PUERTO:-9091}:9090"]
    mem_limit: 512m
    cpus: 0.5
    networks: [tpo]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?definir GRAFANA_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Solo lectura sin ingresar, para proyectar el tablero en la demostración. El puerto escucha solo en
      # 127.0.0.1; para editar hace falta el usuario admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/prode2030.json
    volumes:
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoreo/grafana/tableros:/var/lib/grafana/tableros:ro
      - grafana_datos:/var/lib/grafana
    depends_on: [prometheus]
    ports: ["127.0.0.1:${GRAFANA_PUERTO:-3001}:3000"]
    mem_limit: 256m
    cpus: 0.5
    networks: [tpo]

  # Exportadores: métricas internas de Redis (primario y réplica) y de MongoDB.
  redis_exporter:
    image: oliver006/redis_exporter:v1.75.0
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
    mem_limit: 128m
    cpus: 0.25
    networks: [tpo]

  mongodb_exporter:
    image: percona/mongodb_exporter:0.44.0
    restart: unless-stopped
    command: ["--collect-all", "--compatible-mode", "--mongodb.direct-connect=false"]
    environment:
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet=rs0
      MONGODB_USER: ${MONGO_USER:-admin}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}
    depends_on:
      mongo_inicio: {condition: service_completed_successfully}
    mem_limit: 128m
    cpus: 0.25
    networks: [tpo]

volumes:
  redis_datos:
  prometheus_datos:
  grafana_datos:
  mongo_clave:
  mongo1_datos:
  mongo2_datos:
  mongo3_datos:
  neo4j_datos:
  cassandra_america_datos:
  cassandra_europa_datos:
  influx_datos:

networks:
  tpo:
    name: fixture2030_tpo_net
