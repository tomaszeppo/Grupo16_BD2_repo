# Prode Mundial 2030 — proyecto final. Se levanta solo: no depende de las carpetas de los hitos.
# Los compañeros agregan acá sus servicios (Redis, Cassandra, InfluxDB, Prometheus, Grafana): ver docs/como_sumar_una_base.md
name: fixture2030-tpo

x-mongo: &mongo
  image: mongo:7.0
  restart: unless-stopped
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/clave/archivo", "--wiredTigerCacheSizeGB", "0.25"]
  depends_on:
    mongo_clave:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().ok"]
    interval: 5s
    timeout: 5s
    retries: 20
  mem_limit: ${MONGO_MEMORIA:-512m}
  cpus: ${MONGO_CPUS:-1.0}
  networks: [tpo]

x-api-entorno: &api_entorno
  MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
  MONGO_DB: prode2030
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
  ADMIN_CLAVE: ${ADMIN_CLAVE:?definir ADMIN_CLAVE en .env}
  CALENDARIO_TTL_SEGUNDOS: ${CALENDARIO_TTL_SEGUNDOS:-30}
  API_PROCESOS: ${API_PROCESOS:-2}
  LOG_NIVEL: ${LOG_NIVEL:-INFO}
  API_MEMORIA: ${API_MEMORIA:-512m}
  API_CPUS: ${API_CPUS:-1.0}
  MONGO_MEMORIA: ${MONGO_MEMORIA:-512m}
  MONGO_CPUS: ${MONGO_CPUS:-1.0}
  NEO4J_MEMORIA: ${NEO4J_MEMORIA:-1g}
  NEO4J_CPUS: ${NEO4J_CPUS:-1.0}

services:
  # Los tres nodos se autentican entre sí con un archivo de clave. Se genera una sola vez y queda en un volumen.
  mongo_clave:
    image: mongo:7.0
    restart: "no"
    entrypoint:
      - bash
      - -c
      - "[ -s /clave/archivo ] || openssl rand -base64 756 > /clave/archivo; chmod 400 /clave/archivo; chown 999:999 /clave/archivo"
    volumes: [mongo_clave:/clave]

  mongo1:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO1_PUERTO:-27217}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo1_datos:/data/db]

  mongo2:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO2_PUERTO:-27218}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo2_datos:/data/db]

  mongo3:
    <<: *mongo
    ports: ["127.0.0.1:${MONGO3_PUERTO:-27219}:27017"]
    volumes: [mongo_clave:/clave:ro, mongo3_datos:/data/db]

  # Arma el conjunto de réplicas y crea el usuario administrador. Comparte la red de mongo1 para entrar por
  # localhost, que es la única vía que MongoDB permite antes de que exista un usuario. Se puede repetir.
  mongo_inicio:
    image: mongo:7.0
    restart: "no"
    network_mode: "service:mongo1"
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}
    environment:
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}
    volumes: ["./mongo/iniciar_replica.sh:/iniciar_replica.sh:ro"]
    entrypoint: ["bash", "/iniciar_replica.sh"]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:${NEO4J_HTTP_PUERTO:-7475}:7474", "127.0.0.1:${NEO4J_BOLT_PUERTO:-7688}:7687"]
    volumes: [neo4j_datos:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: ${NEO4J_MEMORIA:-1g}
    cpus: ${NEO4J_CPUS:-1.0}
    networks: [tpo]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo_inicio: {condition: service_completed_successfully}
      neo4j: {condition: service_healthy}
    environment:
      <<: *api_entorno
      PROMETHEUS_MULTIPROC_DIR: /tmp/metricas
    command: ["sh", "-c", "rm -rf /tmp/metricas && mkdir -p /tmp/metricas && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8010 --no-access-log --workers ${API_PROCESOS:-2}"]
    ports: ["127.0.0.1:${API_PUERTO:-8010}:8010"]
    volumes: ["./:/srv"]
    mem_limit: ${API_MEMORIA:-512m}
    cpus: ${API_CPUS:-1.0}
    networks: [tpo]

  # Carga de datos, pruebas de integración y generador de carga. Corre dentro de la red para poder seguir
  # al conjunto de réplicas:  docker compose run --rm herramientas <comando>
  herramientas:
    build: .
    profiles: ["herramientas"]
    environment:
      <<: *api_entorno
      API_URL: http://api:8010
      COMMIT: ${COMMIT:-sin commit}
    command: ["python", "-m", "seed.run"]
    volumes: ["./:/srv"]
    networks: [tpo]

volumes:
  mongo_clave:
  mongo1_datos:
  mongo2_datos:
  mongo3_datos:
  neo4j_datos:

networks:
  tpo:
    name: fixture2030_tpo_net
