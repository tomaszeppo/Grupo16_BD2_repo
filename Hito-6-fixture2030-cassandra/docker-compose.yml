# Ambiente local de Apache Cassandra para el modulo de comentarios masivos
# del Fixture 2030 (Hito 6). Un unico nodo: alcanza para probar el modelo,
# la carga y las consultas. La consigna pide explicitamente montar los datos
# en ~/docker/data/cassandra del host (no un volumen nombrado de Docker como
# en los modulos anteriores) — ver README para la nota sobre Windows.

services:
  cassandra:
    image: cassandra:latest
    container_name: fixture2030-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"   # CQL native transport (cqlsh, drivers)
    environment:
      CASSANDRA_CLUSTER_NAME: fixture2030-cluster
      # Nodo unico de laboratorio: no hay credenciales que exponer (RNF8).
      # El autenticador por defecto (AllowAllAuthenticator) queda documentado
      # como configuracion de desarrollo, no apta para produccion.
    volumes:
      - ~/docker/data/cassandra:/var/lib/cassandra
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - fixture2030

networks:
  # Red compartida entre los 6 modulos de base de datos, para cuando se
  # integren (ver CHANGELOG.md). Hoy cada modulo se sigue levantando solo,
  # esto no cambia ese flujo: Compose crea la red si no existe y la
  # reutiliza si otro modulo ya la creo.
  fixture2030:
    name: fixture2030_net
