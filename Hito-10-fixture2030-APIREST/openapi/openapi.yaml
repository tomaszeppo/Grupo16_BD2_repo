openapi: 3.1.0
info:
  title: Fixture 2030 — API integrada
  description: API REST integrada del Fixture Mundial 2030. Cada endpoint resuelve
    un caso de uso concreto contra la fuente NoSQL que corresponde (MongoDB, Neo4j,
    Cassandra, Redis, InfluxDB, IRIS). No acepta consultas libres. Todos los errores
    usan el formato {error:{codigo,mensaje,request_id}}.
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local (notebook o contenedor, puerto 8000)
paths:
  /equipos/{codigo}:
    get:
      tags:
      - MongoDB · Equipos y jugadores
      summary: Obtener un equipo por código
      description: 'Caso de uso: un hincha o la app consulta la ficha de una selección.
        Lectura por índice único `codigo`.'
      operationId: obtener_equipo_equipos__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA de tres letras
          examples:
          - ARG
          title: Codigo
        description: Código FIFA de tres letras
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipo'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /equipos/{codigo}/jugadores:
    get:
      tags:
      - MongoDB · Equipos y jugadores
      summary: Listar los jugadores de un equipo (paginado)
      description: Orden alfabético por apellido. Equipo inexistente → 404; equipo
        sin coincidencias → 200 con `items` vacío.
      operationId: listar_jugadores_equipos__codigo__jugadores_get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: Código FIFA de tres letras
          examples:
          - ARG
          title: Codigo
        description: Código FIFA de tres letras
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - Portero
            - Defensa
            - Centrocampista
            - Delantero
            type: string
          - type: 'null'
          description: Filtra por posición
          title: Posicion
        description: Filtra por posición
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Máximo de elementos por página (1–100)
          default: 20
          title: Limit
        description: Máximo de elementos por página (1–100)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Cantidad de jugadores a saltear
          default: 0
          title: Offset
        description: Cantidad de jugadores a saltear
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaJugadores'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}:
    get:
      tags:
      - Neo4j · Partidos y eventos
      summary: Obtener un partido con equipos y estadio
      description: Recorre `(Equipo)-[:PARTICIPA_EN]->(Partido)-[:SE_JUEGA_EN]->(Estadio)`
        con Cypher parametrizado.
      operationId: obtener_partido_partidos__partido_id__get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoGrafo'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}/eventos:
    get:
      tags:
      - Neo4j · Partidos y eventos
      summary: Eventos de un partido
      description: Recorre `(Evento)-[:OCURRE_EN]->(Partido)` ordenado por minuto.
        Partido inexistente → 404; sin eventos → 200 vacío.
      operationId: listar_eventos_partidos__partido_id__eventos_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Máximo de eventos (1–200)
          default: 50
          title: Limit
        description: Máximo de eventos (1–200)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosPartido'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}/comentarios:
    get:
      tags:
      - Cassandra · Comentarios
      summary: Leer comentarios de un partido para un país y una ventana de 30 minutos
      description: 'Lectura por la partición completa `(partido_id, pais, ventana)`;
        nunca recorre otras particiones.

        Una partición sin comentarios es un 200 con `items` vacío (válido).'
      operationId: listar_comentarios_partidos__partido_id__comentarios_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      - name: pais
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
          description: País de la audiencia (código FIFA)
          examples:
          - ARG
          title: Pais
        description: País de la audiencia (código FIFA)
      - name: ventana
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inicio de la ventana de 30 minutos (ISO-8601 con zona, minuto
            :00 o :30, p.ej. 2030-06-15T18:30:00Z). Es parte de la clave de partición
            `(partido_id, pais, ventana)`.
          examples:
          - '2030-06-15T18:30:00Z'
          title: Ventana
        description: Inicio de la ventana de 30 minutos (ISO-8601 con zona, minuto
          :00 o :30, p.ej. 2030-06-15T18:30:00Z). Es parte de la clave de partición
          `(partido_id, pais, ventana)`.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Máximo de elementos por página (1–100)
          default: 20
          title: Limit
        description: Máximo de elementos por página (1–100)
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          description: Cursor devuelto como `next_cursor`
          title: Cursor
        description: Cursor devuelto como `next_cursor`
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaComentarios'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    post:
      tags:
      - Cassandra · Comentarios
      summary: Registrar un comentario (idempotente por Idempotency-Key)
      description: 'Escritura. El partido debe existir en Neo4j. `ventana` y `creado_en`
        los fija el servidor en el primer intento.

        201 = alta; 200 = reintento con la misma clave (mismo `comentario_id`); 409
        = clave usada para otro partido o país.'
      operationId: crear_comentario_partidos__partido_id__comentarios_post
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: Clave generada por el cliente; reintentar con la misma clave
            no duplica el comentario
          title: Idempotency-Key
        description: Clave generada por el cliente; reintentar con la misma clave
          no duplica el comentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoComentario'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComentarioCreado'
        '200':
          description: 'Repetición idempotente: devuelve el comentario ya guardado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComentarioCreado'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: 'Conflicto de negocio: el estado actual no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /sesiones/{usuario_id}:
    get:
      tags:
      - Redis · Sesiones
      summary: Consultar la sesión vigente de un usuario
      description: '`GET` de la clave `f2030:sesion:{usuario}`. Clave inexistente,
        expirada o sesión CERRADA → 404 `SESION_NO_VIGENTE`.

        Redis caído → 503 (nunca se confunde con sesión ausente).'
      operationId: obtener_sesion_sesiones__usuario_id__get
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^U\d{3,6}$
          description: Identificador de usuario (U001, …)
          examples:
          - U001
          title: Usuario Id
        description: Identificador de usuario (U001, …)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    delete:
      tags:
      - Redis · Sesiones
      summary: Invalidar la sesión de un usuario
      description: '`DEL` de la clave. Idempotente: repetirlo (o invalidar una sesión
        inexistente) devuelve 204 igual.'
      operationId: invalidar_sesion_sesiones__usuario_id__delete
      parameters:
      - name: usuario_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^U\d{3,6}$
          description: Identificador de usuario (U001, …)
          examples:
          - U001
          title: Usuario Id
        description: Identificador de usuario (U001, …)
      responses:
        '204':
          description: Successful Response
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}/estadisticas:
    get:
      tags:
      - InfluxDB · Estadísticas
      summary: Estadísticas temporales de un partido (ventana acotada y agregación)
      description: 'Siempre acotado por partido y por intervalo (máx. 120 min) y limitado
        a 500 puntos (`truncado`).

        Sin puntos en el intervalo → 200 con `puntos` vacío; InfluxDB caído o credencial
        inválida → 503/504.'
      operationId: obtener_estadisticas_partidos__partido_id__estadisticas_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      - name: desde
        in: query
        required: true
        schema:
          type: string
          description: 'Inicio (inclusive), ISO-8601 con zona. Ej: 2030-06-15T18:30:00Z'
          examples:
          - '2030-06-15T18:30:00Z'
          title: Desde
        description: 'Inicio (inclusive), ISO-8601 con zona. Ej: 2030-06-15T18:30:00Z'
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          description: Fin (exclusivo), ISO-8601 con zona; hasta - desde ≤ 120 min
          examples:
          - '2030-06-15T18:40:00Z'
          title: Hasta
        description: Fin (exclusivo), ISO-8601 con zona; hasta - desde ≤ 120 min
      - name: equipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
          description: Filtra por equipo (tag equipo_id)
          title: Equipo
        description: Filtra por equipo (tag equipo_id)
      - name: agregacion
        in: query
        required: false
        schema:
          enum:
          - raw
          - 1m
          - 5m
          type: string
          description: raw = puntos crudos; 1m/5m = ventanas (AVG/SUM/MAX según la
            semántica del campo)
          default: 1m
          title: Agregacion
        description: raw = puntos crudos; 1m/5m = ventanas (AVG/SUM/MAX según la semántica
          del campo)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estadisticas'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}/detalle:
    get:
      tags:
      - IRIS · Partido (objetos)
      summary: Detalle del partido con sus eventos (objetos IRIS)
      description: 'Lee `Fixture.Partido` y sus `Fixture.Evento` hijos. El id interno
        de IRIS no se expone: la clave pública es `codigo`.'
      operationId: detalle_partido_partidos__partido_id__detalle_get
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoIris'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /partidos/{partido_id}/estado:
    post:
      tags:
      - IRIS · Partido (objetos)
      summary: Cambiar el estado del partido (transición validada)
      description: 'Flujo permitido: Programado → En juego → Finalizado (regla `CambiarEstado`
        de la clase). Transición inválida → 409.

        Idempotente: pedir el estado en el que ya está devuelve 200 sin escribir.'
      operationId: cambiar_estado_partidos__partido_id__estado_post
      parameters:
      - name: partido_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^P-\d{2,3}$
          description: Identificador de partido (P-01, P-02, …)
          examples:
          - P-01
          title: Partido Id
        description: Identificador de partido (P-01, P-02, …)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartidoIris'
        '404':
          description: Recurso inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: 'Conflicto de negocio: el estado actual no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Parámetro, cabecera o cuerpo inválido (se rechaza antes de
            consultar la fuente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno (el detalle técnico queda solo en los logs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia no respondió dentro del timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /health:
    get:
      tags:
      - Sistema
      summary: Estado de la API y de cada dependencia
      description: Hace un `ping` acotado por timeout a cada fuente. Nunca devuelve
        200 si alguna está caída.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Al menos una dependencia no responde (el cuerpo indica cuál)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
