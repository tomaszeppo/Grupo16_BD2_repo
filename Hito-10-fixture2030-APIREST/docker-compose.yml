name: fixture2030-api

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env}
      MONGO_INITDB_DATABASE: fixture2030
    ports: ["127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fixture2030]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir NEO4J_PASSWORD en .env}
    ports: ["127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474", "127.0.0.1:${NEO4J_HOST_PORT:-7687}:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [fixture2030]

  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ["127.0.0.1:${CASSANDRA_HOST_PORT:-9042}:9042"]
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [fixture2030]

  redis:
    image: redis:7
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
      --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [fixture2030]

  influxdb:
    image: influxdb:3-core
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-api
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --http-bind=0.0.0.0:8181
    ports: ["127.0.0.1:${INFLUX_HOST_PORT:-8181}:8181"]
    volumes: [influx_data:/var/lib/influxdb3]
    networks: [fixture2030]

  iris_permisos:
    # IRIS corre como irisowner (uid 51773); el volumen nuevo nace como root y IRIS no podría escribir en /durable.
    image: alpine:3.20
    user: root
    command: chown -R 51773:51773 /durable
    volumes: [iris_data:/durable]
    restart: "no"

  iris:
    image: intersystems/iris-community:latest-cd
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      iris_permisos:
        condition: service_completed_successfully
    environment:
      ISC_DATA_DIRECTORY: /durable
      IRIS_USERNAME: ${IRIS_USER:-fixture}
      IRIS_PASSWORD: ${IRIS_PASSWORD:?definir IRIS_PASSWORD en .env}
    ports: ["127.0.0.1:${IRIS_HOST_PORT:-1972}:1972", "127.0.0.1:${IRIS_PORTAL_HOST_PORT:-52773}:52773"]
    volumes:
      - iris_data:/durable
      - ../Hito-9-fixture2030-iris-objetos/clases:/clases:ro   # clases del Hito 9, sin copiarlas
      - ./seed/iris:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "iris qlist | grep -q running"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [fixture2030]

  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      MONGO_HOST: mongodb
      NEO4J_URI: bolt://neo4j:7687
      CASSANDRA_HOST: cassandra
      REDIS_HOST: redis
      INFLUX_URL: http://influxdb:8181
      IRIS_HOST: iris
      MONGO_PORT: "27017"
      CASSANDRA_PORT: "9042"
      REDIS_PORT: "6379"
      IRIS_PORT: "1972"
    ports: ["127.0.0.1:8000:8000"]
    volumes: [".:/srv"]
    networks: [fixture2030]

volumes:
  mongo_data:
  neo4j_data:
  cassandra_data:
  redis_data:
  influx_data:
  iris_data:

networks:
  fixture2030:
    name: fixture2030_net
