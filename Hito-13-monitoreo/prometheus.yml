# Recolección cada 5 s: los picos de la demo (y las corridas del Hito 12) duran pocos segundos;
# a 15 s quedarían con uno o ningún punto. Costo: el triple de muestras guardadas que con 15 s.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/reglas/reglas-o-alertas.yml

scrape_configs:
  # Métricas de aplicación: pedidos, errores, duración por endpoint y por base, comentarios por país,
  # y disponibilidad de las seis bases (ping de /health en cada recolección).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api_metricas:8001"]
        labels: {componente: api-fixture, tipo: aplicacion}

  # Métricas de infraestructura de Redis (sesiones con TTL), vía exportador.
  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels: {componente: redis, tipo: infraestructura}

  # Métricas de infraestructura de MongoDB (equipos y jugadores), vía exportador.
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb_exporter:9216"]
        labels: {componente: mongodb, tipo: infraestructura}

  # El propio Prometheus: si este job cae, el monitoreo está ciego.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {componente: prometheus, tipo: monitoreo}
